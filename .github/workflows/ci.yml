name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64 / Mojo 1.0
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Install GStreamer on macOS
        run: brew install cmake pkgconf gstreamer libnice-gstreamer
      - name: Verify platform
        run: test "$(uname -m)" = "arm64"
      - name: Build native bridge
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Run native integration suite
        run: ctest --test-dir build --output-on-failure
      - name: Run Mojo 1.0 integration suite
        run: uvx --from mojo==1.0.0 mojo run -I . tests/mojo_smoke.mojo
      - name: Precompile Mojo package and examples
        run: |
          uvx --from mojo==1.0.0 mojo precompile gstreamer_mojo -o build/gstreamer_mojo.mojoc
          uvx --from mojo==1.0.0 mojo build -I . examples/video_frames.mojo -o build/video-frames
          uvx --from mojo==1.0.0 mojo build -I . examples/pcm_to_opus.mojo -o build/pcm-to-opus
          uvx --from mojo==1.0.0 mojo build -I . examples/h264_decode.mojo -o build/h264-decode
          uvx --from mojo==1.0.0 mojo build -I . examples/webrtc_offer.mojo -o build/webrtc-offer

  linux:
    name: Linux ${{ matrix.arch }} / Mojo 1.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and run integration suite
        run: docker build --target builder --tag gstreamer-mojo-ci .
